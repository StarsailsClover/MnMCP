# MnMCP 3 配置文件模板
# 复制此文件为 config.yaml 并填入你的配置
# 警告: 不要将 config.yaml 提交到Git仓库!

mini:
  auth:
    # 迷你世界账号信息 (仅创建房间时需要)
    uin: 0                    # 迷你世界账号QQ号/UIN
    passwd: ""                # 账号密码
    api_id: 110               # API ID (通常保持110)
    device_id: ""             # 设备ID (32位UUID格式)
    xxtea_key: ""               # XXTEA加密密钥 (从逆向分析获取)
  
  server:
    ip: "127.0.0.1"           # 本地监听地址
    port: 11155               # 本地监听端口
    host_to_room_server: false  # 是否创建迷你房间
                                # true: 创建房间模式 (无法MITM)
                                # false: 桥接模式 (用于MITM测试)
    
    # 房间服务器配置 (可选，用于host_to_room_server=true)
    room_server_ip: ""        # 从openroom.mini1.cn获取
    room_server_port: 0       # 房间服务器端口
  
  # 中心服务器地址 (如需修改可在此配置)
  central_server:
    auth_url: "https://wskacchm.mini1.cn:14130"
    room_url: "http://openroom.mini1.cn:8080"
    sign_key: ""              # 登录签名密钥 (留空使用默认)
    auth_key: ""              # 房间认证密钥 (留空使用默认)
  
  send_log_to_chat: false     # 是否将日志发送到游戏聊天

mc:
  ip: "127.0.0.1"             # Minecraft服务器地址
  port: 25565                 # Minecraft服务器端口
  username: ""                # 指定MC玩家名称 (留空使用迷你世界名称)
  version: "1.21.11"          # Minecraft版本 (当前仅支持1.21.11)
  use_new_chunk_parser: true  # 使用新版区块解析器 (减小开销但可能超时)
  chunk_parse_thread: 4       # 区块解析线程数
  log_message: false            # 是否记录聊天消息

# 调试配置
debug: false                  # 启用调试模式 (会输出更多日志)

# 网络配置 (高级)
network:
  # 内网穿透配置 (用于创建房间模式)
  tunnel:
    enabled: false            # 是否启用内网穿透
    type: "frp"               # 穿透工具类型: frp/ngrok/custom
    server: ""                # 穿透服务器地址
    port: 7000                # 穿透服务器端口
    token: ""                 # 认证令牌
  
  # MITM代理配置 (用于开发测试)
  proxy:
    enabled: false
    host: "127.0.0.1"
    port: 7890

# 安全设置 (重要!)
security:
  # 会话密钥 (运行时生成，无需手动设置)
  session_key: ""
  
  # 加密设置
  encryption:
    enabled: true
    algorithm: "AES-256-GCM"
    key_rotation_interval: 3600  # 密钥轮换间隔(秒)
